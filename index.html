
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick PDF Tool - Photo to PDF</title>
<meta name="description" content="Convert photos into PDF with extracted text and original image in two pages.">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#172554;font-family:Arial,sans-serif}
header{background:#172554;color:white;text-align:center;padding:25px 12px}
header h1{margin:0;font-size:30px}
header p{color:#dbeafe}
main{max-width:650px;margin:25px auto;padding:0 14px}
.card{background:white;border-radius:15px;padding:22px;box-shadow:0 4px 18px #0001}
h2{margin-top:0}
input{width:100%;padding:14px;border:1px dashed #64748b;border-radius:9px;margin:12px 0}
button{width:100%;padding:14px;border:0;border-radius:9px;background:#2563eb;color:white;font-size:16px;font-weight:bold;margin-top:12px}
button:disabled{opacity:.5}
#preview{max-width:100%;max-height:300px;display:none;margin:15px auto;border-radius:8px}
#status{padding:12px;background:#eff6ff;border-radius:8px;margin-top:15px;line-height:1.5}
#output{margin-top:15px;white-space:pre-wrap;overflow-wrap:anywhere;font-family:'Noto Sans Devanagari',Arial,sans-serif;line-height:1.7}
footer{text-align:center;padding:25px;color:#64748b}
</style>
</head>
<body>
<header>
<h1>📄 Quick PDF Tool</h1>
<p>Convert your photo into a two-page PDF</p>
</header>
<main>
<div class="card">
<h2>Photo to PDF Converter</h2>
<p>Upload a photo. We will extract its text and create a PDF with two pages.</p>
<input type="file" id="photo" accept="image/*">
<img id="preview" alt="Selected photo preview">
<button id="convert" disabled>Convert Photo to PDF</button>
<div id="status">Please select a photo to get started.</div>
<div id="output"></div>
<button id="download" hidden>Download PDF</button>
</div>
</main>
<footer>© 2026 Quick PDF Tool</footer>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
const photo=document.getElementById('photo');
const preview=document.getElementById('preview');
const convert=document.getElementById('convert');
const download=document.getElementById('download');
const status=document.getElementById('status');
const output=document.getElementById('output');
let imageData='';
let extractedText='';

photo.addEventListener('change',()=>{
const file=photo.files[0];
if(!file)return;
if(!file.type.startsWith('image/')){
status.textContent='Please select a valid image.';
return;
}
const reader=new FileReader();
reader.onload=()=>{
imageData=reader.result;
preview.src=imageData;
preview.style.display='block';
convert.disabled=false;
download.hidden=true;
output.textContent='';
status.textContent='Photo selected. Ready to convert.';
};
reader.readAsDataURL(file);
});

convert.addEventListener('click',async()=>{
if(!imageData)return;
convert.disabled=true;
download.hidden=true;
output.textContent='';
try{
status.textContent='Reading photo... Please wait.';
const result=await Tesseract.recognize(imageData,'eng+hin',{
logger:m=>{
if(m.status==='recognizing text'){
status.textContent='Extracting text: '+Math.round(m.progress*100)+'%';
}
}
});
extractedText=result.data.text.trim();
if(!extractedText)extractedText='No readable text was found in this photo.';
output.textContent=extractedText;
status.textContent='Text extracted. Preparing your two-page PDF...';
await document.fonts.ready;

const wrapper=document.createElement('div');
wrapper.style.width='180mm';
wrapper.style.fontFamily="'Noto Sans Devanagari', Arial, sans-serif";

const page1=document.createElement('div');
page1.style.width='180mm';
page1.style.minHeight='265mm';
page1.style.padding='10mm';
page1.style.pageBreakAfter='always';
page1.innerHTML='<h2 style="color:#172554">Extracted Text</h2><div style="white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:12pt"></div>';
page1.querySelector('div').textContent=extractedText;

const page2=document.createElement('div');
page2.style.width='180mm';
page2.style.height='265mm';
page2.style.padding='10mm';
page2.style.display='flex';
page2.style.flexDirection='column';
page2.style.alignItems='center';
page2.style.justifyContent='center';
page2.style.pageBreakAfter='auto';
page2.innerHTML='<h2 style="color:#172554">Original Photo</h2>';
const img=document.createElement('img');
img.src=imageData;
img.style.maxWidth='100%';
img.style.maxHeight='235mm';
img.style.objectFit='contain';
page2.appendChild(img);

wrapper.append(page1,page2);
document.body.appendChild(wrapper);

await html2pdf().set({
margin:10,
filename:'Quick-PDF-Tool.pdf',
image:{type:'jpeg',quality:0.95},
html2canvas:{scale:2,useCORS:true},
jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
pagebreak:{mode:['css','legacy']}
}).from(wrapper).save();

wrapper.remove();
status.textContent='Your PDF is ready! You can download it again using the button below.';
download.hidden=false;
}catch(error){
status.textContent='Something went wrong. Please try another photo or try again.';
console.error(error);
}finally{
convert.disabled=false;
}
});

download.addEventListener('click',()=>{
status.textContent='To create the PDF again, press Convert Photo to PDF.';
});
</script>
</body>
</html>
